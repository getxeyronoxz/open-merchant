name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.9);
        # specifying a second one here makes the action fail fast.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Full E2E against the real Electron app and IPC stack on every push.
      # Linux runners have no display server — xvfb provides a virtual one;
      # Windows and macOS runners have interactive sessions out of the box.
      - name: Electron end-to-end (real app, real IPC)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y xvfb
            xvfb-run --auto-servernum pnpm --filter @open-merchant/desktop test:e2e
          else
            pnpm --filter @open-merchant/desktop test:e2e
          fi
