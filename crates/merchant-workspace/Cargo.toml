[package]
name = "merchant-workspace"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
merchant-core = { path = "../merchant-core" }
chrono = "0.4"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
