[package]
name = "merchant-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
rust_decimal = { version = "1", features = ["serde"] }
