appId: com.xeyronox.openmerchant
productName: Open Merchant
# AppImage rejects the scoped package name; keep the executable path-safe.
executableName: open-merchant
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# Workspace packages are bundled into out/ by electron-vite; node_modules
# needed at runtime are only electron itself.
npmRebuild: false
# Update feed: electron-updater reads this channel (latest.yml on Releases).
publish:
  provider: github
  owner: getxeyronoxz
  repo: open-merchant
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.business
linux:
  target:
    - AppImage
    - snap
    - flatpak
  icon: build/icon.png
  category: Office
  # Universal Linux packages: containerized formats that run on any modern
  # distribution without dependency juggling (built by electron-builder; the
  # release workflow installs snapcraft/flatpak requirements).
  maintainer: Xeyronox
  # (Snap-specific options live in the top-level `snap:` block below — the
  # LinuxConfiguration schema has no snap key.)
flatpak:
  runtimeVersion: "23.08"
# The snap artifact filename must not contain the scoped package name:
# electron-builder derives it from "${name}" (the package name
# @open-merchant/desktop) and the "/" makes mksquashfs fail with "Could not
# create destination file". Override the file name explicitly (the snap's
# internal name is already open-merchant via executableName).
# `publish: github` keeps the snap OUT of the Snap Store: snap targets
# default to publishing there, which fails on CI without Snap Store
# credentials — this repo ships everything through GitHub Releases only.
snap:
  artifactName: open-merchant-${version}-${arch}.${ext}
  publish: github
