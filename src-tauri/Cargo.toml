[package]
name = "open-merchant"
version = "0.1.0"
description = "Local-first commerce research workspace"
authors = ["Open Merchant contributors"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "open_merchant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
merchant-core = { path = "../crates/merchant-core" }
merchant-workspace = { path = "../crates/merchant-workspace" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
